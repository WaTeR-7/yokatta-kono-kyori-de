<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>良かったこの距離で</title>
<meta name="description" content="最短でも最長でもない、ちょうどこの距離を狙うハミルトン経路パズル。">
<meta property="og:title" content="良かったこの距離で">
<meta property="og:description" content="最短でも最長でもない、ちょうどこの距離を狙うハミルトン経路パズル。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f4f5f8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ffffff'/><path d='M7 23 L25 9' stroke='%237c3aed' stroke-width='2.5'/><circle cx='7' cy='23' r='3.5' fill='%230d9488'/><circle cx='25' cy='9' r='3.5' fill='%237c3aed'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="hud">
    <div class="hud-left">
      <span class="hud-label">STAGE</span>
      <span class="hud-value" id="hud-stage">1</span>
    </div>
    <div class="hud-mid">
      <span class="hud-time" id="hud-time" aria-label="残り時間">60.0</span>
      <button type="button" class="sound-toggle" id="btn-sound" aria-label="音の切り替え">♪</button>
    </div>
    <div class="hud-right">
      <span class="hud-label">SCORE</span>
      <span class="hud-value" id="hud-score">0</span>
    </div>
  </header>

  <div class="timebar"><div class="timebar-fill" id="timebar-fill"></div></div>

  <section class="quest" id="quest">
    <div class="quest-main">
      <span class="quest-lead">お題</span>
      <span class="quest-band" id="quest-band">第 — 〜 — 位</span>
    </div>
  </section>

  <section class="board-wrap">
    <canvas id="board" aria-label="盤面"></canvas>
  </section>

  <section class="dist">
    <div class="dist-head">
      <span class="dist-title">長さの分布</span>
      <span class="dist-now" id="dist-now">—</span>
    </div>
    <canvas id="hist-full" aria-label="全体の長さ分布"></canvas>
    <div class="zoom-hint" id="zoom-hint"></div>
  </section>

  <section class="controls">
    <button type="button" class="btn btn-ghost" id="btn-undo">ひとつ戻す</button>
    <button type="button" class="btn btn-ghost" id="btn-clear">全部消す</button>
    <button type="button" class="btn btn-go" id="btn-submit" disabled>提出</button>
  </section>

</div>

<!-- タイトル -->
<div class="screen" id="screen-title">
  <div class="screen-card">
    <h1 class="title">良かった<br>この距離で</h1>
    <p class="tagline">最短でも最長でもない、<br><em>ちょうどこの距離</em>を狙え。</p>
    <div class="rules">
      <ul class="rules-list">
        <li>点を1回ずつ通る経路を選びます。</li>
        <li>経路の距離がちょうどいい範囲を目指します。</li>
        <li>制限時間60秒。正誤で増減します。</li>
      </ul>
      <p class="rules-tip"><strong>コツ：</strong>近い点から順につなぐと、ほぼ必ず<strong>短すぎ</strong>ます。<strong>わざと遠回りして</strong>長さを合わせるゲームです。</p>
    </div>
    <button type="button" class="btn btn-go btn-big" id="btn-start">はじめる</button>
    <p class="credit">© 2026 / <a href="https://github.com/WaTeR-7/yokatta-kono-kyori-de" target="_blank" rel="noopener">ソース</a></p>
  </div>
</div>

<!-- 判定 -->
<div class="screen screen-judge" id="screen-judge">
  <div class="judge-card">
    <div class="judge-verdict" id="judge-verdict"></div>
    <div class="judge-time" id="judge-time"></div>
    <div class="judge-gain" id="judge-gain"></div>
    <button type="button" class="btn btn-go" id="btn-next">次へ</button>
  </div>
</div>

<!-- リザルト -->
<div class="screen" id="screen-result">
  <div class="screen-card">
    <div class="result-lead">じゃああの、続きまして、<br>次のゲーム行ってみましょか</div>
    <div class="result-score" id="result-score">0</div>
    <div class="result-meta" id="result-meta"></div>
    <div class="result-best" id="result-best"></div>
    <div class="result-actions">
      <button type="button" class="btn btn-go" id="btn-retry">もう一度</button>
      <a class="btn btn-share" id="btn-share" target="_blank" rel="noopener">Xで共有</a>
    </div>
  </div>
</div>

<!-- 計算中 -->
<div class="screen screen-loading" id="screen-loading">
  <div class="loading-card">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">全経路を数えています…</div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
